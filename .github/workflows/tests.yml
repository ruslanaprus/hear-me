name: Tests

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / Drupal 11
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.5'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, mbstring, pdo_mysql, simplexml, xml, zip
          coverage: none
          tools: composer:v2

      - name: Create Drupal project
        run: composer create-project drupal/recommended-project:^11 drupal --no-interaction --no-progress

      - name: Check out HearMe
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: drupal/web/modules/custom/hear_me
          persist-credentials: false

      - name: Validate Composer metadata
        working-directory: drupal/web/modules/custom/hear_me
        run: composer validate --strict

      - name: Install module development dependencies
        working-directory: drupal/web/modules/custom/hear_me
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Drupal project dependencies
        working-directory: drupal
        run: composer audit --locked --no-interaction

      - name: Audit module development dependencies
        working-directory: drupal/web/modules/custom/hear_me
        run: composer audit --locked --no-interaction

      - name: Check release archive
        if: matrix.php == '8.3'
        working-directory: drupal/web/modules/custom/hear_me
        run: bash scripts/check-package.sh

      - name: Enforce release fixture policy
        if: matrix.php == '8.3'
        working-directory: drupal/web/modules/custom/hear_me
        run: bash scripts/check-release-fixtures.sh

      - name: Run PHPStan
        working-directory: drupal/web/modules/custom/hear_me
        run: |
          composer phpstan
          if grep -Eiq 'deprecated|deprecation' phpstan-baseline.neon; then
            echo "PHPStan deprecation findings must not be added to the baseline." >&2
            exit 1
          fi

      - name: Run PHPCS
        working-directory: drupal/web/modules/custom/hear_me
        run: vendor/bin/phpcs

      - name: Start Drupal web server
        working-directory: drupal
        run: |
          php -S 127.0.0.1:8888 -t web "$PWD/web/.ht.router.php" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in {1..30}; do
            php -r '$socket = @fsockopen("127.0.0.1", 8888); if ($socket) { fclose($socket); exit(0); } exit(1);' && exit 0
            sleep 1
          done
          exit 1

      - name: Run PHPUnit
        working-directory: drupal/web/modules/custom/hear_me
        env:
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
          SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1:3306/drupal
          BROWSERTEST_OUTPUT_DIRECTORY: ${{ runner.temp }}/browser_output
        run: |
          set -o pipefail
          bash scripts/check-deprecation-events.sh --self-test
          mkdir -p "$BROWSERTEST_OUTPUT_DIRECTORY"
          php tests/phpunit.php -c phpunit.xml.dist \
            --log-events-text "$RUNNER_TEMP/phpunit-events.log" \
            2>&1 | tee "$RUNNER_TEMP/phpunit.log"
          bash scripts/check-deprecation-events.sh "$RUNNER_TEMP/phpunit-events.log"

      - name: Upload browser test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-output-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/browser_output
            ${{ runner.temp }}/php-server.log
            ${{ runner.temp }}/phpunit-events.log
            ${{ runner.temp }}/phpunit.log
