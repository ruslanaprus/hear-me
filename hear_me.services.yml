services:
  plugin.manager.hear_me.tts_provider:
    class: Drupal\hear_me\Plugin\TtsProvider\TtsProviderManager
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'

  hear_me.provider_resolver:
    class: Drupal\hear_me\Service\TtsProviderResolver
    arguments:
      - '@config.factory'
      - '@plugin.manager.hear_me.tts_provider'
      - '@logger.factory'

  # TTS endpoint request validator
  hear_me.input_validator:
    class: Drupal\hear_me\Service\HearMeInputValidator
    arguments:
      - '@config.factory'
      - '@hear_me.provider_resolver'

  # Runtime audio cache metadata and retention manager
  hear_me.cache_manager:
    class: Drupal\hear_me\Service\TtsCacheManager
    arguments:
      - '@database'
      - '@config.factory'
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@entity_type.manager'
      - '@file.usage'
      - '@datetime.time'
      - '@logger.factory'

  # Flood API throttle and quota manager
  hear_me.rate_limiter:
    class: Drupal\hear_me\Service\HearMeRateLimiter
    arguments:
      - '@config.factory'
      - '@flood'
      - '@current_user'
      - '@request_stack'

  # Node queue payload builder for pre-generated audio
  hear_me.node_audio_queue:
    class: Drupal\hear_me\Service\HearMeNodeAudioQueue
    arguments:
      - '@config.factory'
      - '@hear_me.provider_resolver'
      - '@hear_me.input_validator'
      - '@entity_type.manager'
      - '@queue'
      - '@state'
      - '@keyvalue'
      - '@lock'
      - '@datetime.time'
      - '@logger.factory'

  # Shared validator for node audio fields used by queue generation.
  hear_me.audio_field_validator:
    class: Drupal\hear_me\Service\HearMeAudioFieldValidator
    arguments:
      - '@entity_type.manager'

  # Provisions generated audio fields and their default displays.
  hear_me.audio_field_provisioner:
    class: Drupal\hear_me\Service\AudioFieldProvisioner
    arguments:
      - '@entity_type.manager'

  # Existing node backfill queue manager
  hear_me.existing_content_queue:
    class: Drupal\hear_me\Service\HearMeExistingContentQueue
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@hear_me.node_audio_queue'
      - '@hear_me.provider_resolver'
      - '@hear_me.audio_field_validator'

  Drupal\hear_me\Service\HearMeExistingContentQueue: '@hear_me.existing_content_queue'

  # Installation and runtime readiness checks for the admin settings form
  hear_me.setup_status:
    class: Drupal\hear_me\Service\HearMeSetupStatus
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@file_system'
      - '@stream_wrapper_manager'
      - '@plugin.manager.queue_worker'
      - '@state'
      - '@date.formatter'
      - '@datetime.time'
      - '@hear_me.provider_resolver'
      - '@hear_me.audio_field_validator'

  # Central orchestrator service
  hear_me.service:
    class: Drupal\hear_me\Service\HearMeService
    arguments:
      - '@hear_me.provider_resolver'
      - '@hear_me.audio_media_factory'
      - '@hear_me.cache_manager'
      - '@hear_me.input_validator'
      - '@lock'
      - '@logger.factory'
      - '@private_key'

  # Creates persistent File and Media entities for generated audio.
  hear_me.audio_media_factory:
    class: Drupal\hear_me\Service\AudioMediaFactory
    arguments:
      - '@entity_type.manager'
      - '@language_manager'

  # Attaches generated audio Media to configured node fields.
  hear_me.node_audio_attacher:
    class: Drupal\hear_me\Service\NodeAudioAttacher
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@database'
      - '@lock'
      - '@queue'
      - '@keyvalue'
      - '@datetime.time'
      - '@hear_me.node_audio_queue'
      - '@hear_me.cache_manager'
      - '@logger.factory'

  hear_me.uninstall_validator:
    class: Drupal\hear_me\Service\HearMeUninstallValidator
    arguments:
      - '@entity_type.manager'
      - '@string_translation'
    tags:
      - { name: module_install.uninstall_validator }
